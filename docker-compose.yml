services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres-init/umami.sql:/docker-entrypoint-initdb.d/10-umami.sql:ro
      - ./deploy/postgres-init/bugsink.sql:/docker-entrypoint-initdb.d/11-bugsink.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    image: ${BACKEND_IMAGE:-carrotnclaw-backend:local}
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DEBUG: "false"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DJANGO_ALLOWED_HOSTS: ${SITE_DOMAIN},backend,localhost
      BACKEND_PUBLIC_URL: https://${SITE_DOMAIN}
      FRONTEND_URL: https://${SITE_DOMAIN}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
    volumes:
      - media:/app/media
      - static:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v2/site-settings/', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    image: ${FRONTEND_IMAGE:-carrotnclaw-frontend:local}
    build: ./frontend
    restart: unless-stopped
    environment:
      PORT: "3000"
      ORIGIN: https://${SITE_DOMAIN}
      WAGTAIL_INTERNAL_URL: http://backend:8000
      # Empty disables the analytics script
      PUBLIC_UMAMI_WEBSITE_ID: ${PUBLIC_UMAMI_WEBSITE_ID:-}
      # Error reporting; both DSNs point at the Bugsink "frontend" project. Empty disables it.
      SENTRY_DSN: ${SENTRY_DSN_FRONTEND:-}
      PUBLIC_SENTRY_DSN: ${PUBLIC_SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
      PUBLIC_SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
    depends_on:
      backend:
        condition: service_healthy

  umami:
    image: ghcr.io/umami-software/umami:3.3.1
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET}
      TWO_FACTOR_ENCRYPTION_KEY: ${UMAMI_TWO_FACTOR_KEY}
      DISABLE_TELEMETRY: "1"
      # Renamed so ad blockers do not match the defaults; the frontend loads /stats/tavern.js
      TRACKER_SCRIPT_NAME: tavern.js
      COLLECT_API_ENDPOINT: /api/tavern
    mem_limit: 400m
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:3000/api/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  bugsink:
    image: bugsink/bugsink:2.5.1
    restart: unless-stopped
    environment:
      SECRET_KEY: ${BUGSINK_SECRET_KEY}
      # First start only; later starts leave the existing user alone
      CREATE_SUPERUSER: ${BUGSINK_ADMIN_EMAIL}:${BUGSINK_ADMIN_PASSWORD}
      PORT: "8000"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/bugsink
      BASE_URL: https://${ERRORS_DOMAIN}
      BEHIND_HTTPS_PROXY: "true"
      # Caddy sets X-Real-IP for this upstream (see Caddyfile)
      USE_X_REAL_IP: "true"
      SINGLE_TEAM: "true"
      USER_REGISTRATION: CB_ADMINS
      # Alerts go to Telegram (configured in the UI); no SMTP anywhere
      EMAIL_BACKEND: django.core.mail.backends.dummy.EmailBackend
      PHONEHOME: "false"
      TIME_ZONE: Europe/Moscow
    mem_limit: 350m
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import requests; requests.get(\"http://localhost:8000/health/ready\", timeout=5).raise_for_status()'"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 60s

  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_LISTEN:-80}:80"
      - "${CADDY_HTTPS_LISTEN:-443}:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      STATS_DOMAIN: ${STATS_DOMAIN}
      ERRORS_DOMAIN: ${ERRORS_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - media:/srv/media:ro
      - static:/srv/static:ro
    depends_on:
      - backend
      - frontend
      - umami
      - bugsink

volumes:
  pgdata:
  media:
  static:
  caddy_data:
  caddy_config:
