services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    image: ${BACKEND_IMAGE:-carrotnclaw-backend:local}
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DEBUG: "false"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DJANGO_ALLOWED_HOSTS: ${SITE_DOMAIN},backend,localhost
      BACKEND_PUBLIC_URL: https://${SITE_DOMAIN}
      FRONTEND_URL: https://${SITE_DOMAIN}
    volumes:
      - media:/app/media
      - static:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v2/site-settings/', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    image: ${FRONTEND_IMAGE:-carrotnclaw-frontend:local}
    build: ./frontend
    restart: unless-stopped
    environment:
      PORT: "3000"
      ORIGIN: https://${SITE_DOMAIN}
      WAGTAIL_INTERNAL_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_LISTEN:-80}:80"
      - "${CADDY_HTTPS_LISTEN:-443}:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - media:/srv/media:ro
      - static:/srv/static:ro
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
  media:
  static:
  caddy_data:
  caddy_config:
